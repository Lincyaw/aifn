[project]
name = "aifn"
version = "0.4.1"
description = "AI functions: a declared signature, an agent call for a body, requests and conclusions in between"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "filelock>=3.32.7",
    "pydantic>=2.14.2",
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
# An engine is a replaceable layer, so the SDK is not a core dependency: only
# aifn.engines.deepseek reads it, and a replay reads a recorded transcript, which
# needs nothing of it.
deepseek = [
    # Pin the SDK client to the release verified with the private npm runtime.
    "deepseek-harness-sdk==0.2.1rc2",
]
trajectory = ["dsh-trajectory==0.1.1"]

[tool.uv.sources]
dsh-trajectory = { path = "packages/dsh-trajectory" }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifn"]

[tool.hatch.build.targets.wheel.force-include]
"harness/aifn-harness/src" = "aifn/harness/src"
"harness/aifn-harness/package.json" = "aifn/harness/package.json"
"harness/aifn-harness/cordis.patch.yml" = "aifn/harness/cordis.patch.yml"
"harness/aifn-harness/runtime/package.json" = "aifn/harness/runtime/package.json"
"harness/aifn-harness/runtime/package-lock.json" = "aifn/harness/runtime/package-lock.json"
"harness/dsh-access-policy/src" = "aifn/srt/src"
"harness/dsh-access-policy/package.json" = "aifn/srt/package.json"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3,<0.18",
]

# Written here because the mirror this machine is configured with answers 403 for
# these packages, and uv reports a mirror's failure as "requirements are
# unsatisfiable", which reads like a version constraint that will not solve.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# A call's execution path may not know which harness it is running on: an engine is
# a protocol, aifn.engines is one implementation of it, and only whoever assembles
# the two gets to read both.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aifn.engines".msg = "a worker holds an Engine, not one engine's name"

[tool.ruff.lint.per-file-ignores]
# Engine implementations may read their own package's provider integrations.
"src/aifn/engines/*.py" = ["TID251"]
"src/aifn/__main__.py" = ["TID251"]
"tests/*" = ["TID251"]
"examples/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

# The SDK ships no py.typed, and only this module and the bundle's loadability test
# read it.
[[tool.mypy.overrides]]
module = ["deepseek_harness.*", "deepseek_harness_runtime.*", "dsh_trajectory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
