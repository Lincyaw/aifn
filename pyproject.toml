[project]
name = "aifn"
version = "0.1.0"
description = "AI functions: a declared signature, an agent call for a body, an outbox and an inbox in between"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # 声明的输出类型就是 Pydantic 模型，outbox 和 inbox 的每一行也是。
    # 校验和序列化是同一件事，所以这是唯一的运行时依赖。
    "pydantic>=2.12",
]

[project.optional-dependencies]
# engine 是可替换的一层，所以 SDK 不是核心依赖：
# 只有 aifn.engines.deepseek 读它，而一次重放读录下来的事件流，不需要它。
deepseek = [
    "deepseek-harness-sdk>=0.1.2rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifn"]

[dependency-groups]
dev = [
    "mypy>=2.3,<2.4",
    "pytest>=8.0",
    "ruff>=0.16.2,<0.17",
]

# 写在这里，因为这台机器配置的全局镜像对这几个包返回 403，
# 而 uv 把镜像的失败报成「requirements are unsatisfiable」，看上去像是版本约束解不开。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# 一次调用的执行路径不许知道自己跑在哪个 harness 上：
# engine 是协议，aifn.engines 是它的一个实现，只有组装的人能同时读到两者。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aifn.engines".msg = "a worker holds an Engine, not one engine's name"

[tool.ruff.lint.per-file-ignores]
# engines 的 __init__ 就是那个包自己，它当然读得到自己的模块。
"src/aifn/engines/__init__.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# SDK 不带 py.typed，而这是唯一读它的模块。
[[tool.mypy.overrides]]
module = ["deepseek_harness.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
