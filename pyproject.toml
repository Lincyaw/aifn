[project]
name = "aifn"
version = "0.1.0"
description = "AI functions: a declared signature, an agent call for a body, an outbox and an inbox in between"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # A declared output type is a Pydantic model, and so is every line of an outbox
    # and an inbox. Validation and serialization are the same act, which makes this
    # the one runtime dependency.
    "pydantic>=2.12",
]

[project.optional-dependencies]
# An engine is a replaceable layer, so the SDK is not a core dependency: only
# aifn.engines.deepseek reads it, and a replay reads a recorded transcript, which
# needs nothing of it.
deepseek = [
    "deepseek-harness-sdk>=0.1.2rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifn"]

[dependency-groups]
dev = [
    "mypy>=2.3,<2.4",
    "pytest>=8.0",
    "ruff>=0.16.2,<0.17",
]

# Written here because the mirror this machine is configured with answers 403 for
# these packages, and uv reports a mirror's failure as "requirements are
# unsatisfiable", which reads like a version constraint that will not solve.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# A call's execution path may not know which harness it is running on: an engine is
# a protocol, aifn.engines is one implementation of it, and only whoever assembles
# the two gets to read both.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aifn.engines".msg = "a worker holds an Engine, not one engine's name"

[tool.ruff.lint.per-file-ignores]
# The engines package's __init__ is that package itself, so of course it reads its
# own modules.
"src/aifn/engines/__init__.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# The SDK ships no py.typed, and only this module and the bundle's loadability test
# read it.
[[tool.mypy.overrides]]
module = ["deepseek_harness.*", "deepseek_harness_runtime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
