[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dsh-trajectory"
version = "0.1.0"
description = "Convert DeepSeek Harness v4 logs to ATIF and ingest before cleanup"
readme = "README.md"
license-files = ["licenses/*.txt", "THIRD_PARTY.md", "UPSTREAM.json"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "zstandard>=0.23,<1"]
classifiers = ["Operating System :: POSIX", "Programming Language :: Python :: 3"]

[project.scripts]
dsh-trajectory = "dsh_trajectory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_trajectory"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
